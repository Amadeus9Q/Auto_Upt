platform: zhihu
display_name: 知乎
content_types:
  - article
  - mixed
publish_modes:
  - simulate
auth:
  type: browser_or_cookie
  required_for_real_publish: true
limits:
  title_max_length: 100
  body_max_length: 50000
  tags_max_count: 5
  assets_min_count: 0
style:
  tone: reasoned answer
  title_hint: prefer question-oriented framing
assets:
  cover_required: false
