platform: zhihu
display_name: 知乎
content_types:
  - article
  - mixed
publish_modes:
  - simulate
auth:
  type: browser_or_cookie
  required_for_real_publish: true
limits:
  title_max_length: 200
  body_max_length: 0
  tags_max_count: 20
  assets_min_count: 0
style:
  tone: 专业严谨，深度知识分享
  title_hint: 建议用提问式标题
assets:
  cover_required: false
