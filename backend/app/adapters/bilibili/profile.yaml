platform: bilibili
display_name: B站
content_types:
  - article
  - video
  - mixed
publish_modes:
  - simulate
  - draft
  - publish
auth:
  type: cookie_or_biliup
  required_for_real_publish: true
limits:
  title_max_length: 80
  body_max_length: 2000
  tags_max_count: 10
  assets_min_count: 0
style:
  tone: video description
  title_hint: direct and searchable
assets:
  cover_required: false
