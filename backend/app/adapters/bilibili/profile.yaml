platform: bilibili
display_name: B站
content_types:
  - article
  - video
  - mixed
publish_modes:
  - simulate
  - draft
  - publish
auth:
  type: cookie
  required_for_real_publish: true
limits:
  title_max_length: 200
  body_max_length: 0
  tags_max_count: 20
  assets_min_count: 0
style:
  tone: 轻松年轻化，视频描述
  title_hint: 直接、可搜索
assets:
  cover_required: false
