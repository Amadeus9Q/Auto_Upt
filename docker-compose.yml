services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auto_upt
      POSTGRES_USER: auto_upt
      POSTGRES_PASSWORD: auto_upt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_upt -d auto_upt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://auto_upt:auto_upt@postgres:5432/auto_upt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-12}
      IMPORT_USE_LLM: ${IMPORT_USE_LLM:-true}
      IMPORT_LLM_TIMEOUT_SECONDS: ${IMPORT_LLM_TIMEOUT_SECONDS:-25}
      IMPORT_LLM_MAX_CHARS: ${IMPORT_LLM_MAX_CHARS:-12000}
      IMPORT_ANALYSIS_USE_LLM: ${IMPORT_ANALYSIS_USE_LLM:-false}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      BROWSER_HEADLESS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ASSET_STORAGE_DIR: storage/assets
      SCREENSHOT_DIR: storage/screenshots
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A backend.app.tasks.celery_app worker --loglevel=info
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://auto_upt:auto_upt@postgres:5432/auto_upt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      IMPORT_USE_LLM: ${IMPORT_USE_LLM:-true}
      IMPORT_LLM_TIMEOUT_SECONDS: ${IMPORT_LLM_TIMEOUT_SECONDS:-25}
      IMPORT_LLM_MAX_CHARS: ${IMPORT_LLM_MAX_CHARS:-12000}
      IMPORT_ANALYSIS_USE_LLM: ${IMPORT_ANALYSIS_USE_LLM:-false}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      BROWSER_HEADLESS: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ASSET_STORAGE_DIR: storage/assets
      SCREENSHOT_DIR: storage/screenshots
      WECHAT_API_BASE_URL: ${WECHAT_API_BASE_URL:-https://api.weixin.qq.com}
      XIAOHONGSHU_API_KEY: ${XIAOHONGSHU_API_KEY:-}
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
